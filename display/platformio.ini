; SpiroBird — Display / Slave ESP32-S3 firmware
;
; Board: LCDWiki ES3C28P / ES3N28P — 2.8" 240x320 ILI9341V, 4-wire SPI,
;        ESP32-S3 N16R8 module (16 MB flash + 8 MB OPI PSRAM)
; Pinout source: https://www.lcdwiki.com/2.8inch_ESP32-S3_Display
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200

[env:display_es3c28p]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  ; TFT_eSPI is configured entirely from include/display_config.h, which is
  ; force-included into every translation unit (so the library sees the pins):
  -include include/display_config.h

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
