; SpiroBird — Controller / Master ESP32-S3 firmware
;
; Board: DUBEUYEW ESP32-S3 dev board, module ESP32-S3-N16R8
;        (16 MB QIO flash + 8 MB octal PSRAM)
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200

[env:controller_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8: 16 MB quad flash + 8 MB octal PSRAM.
; If the board fails to boot with these flags, remove memory_type/PSRAM flags —
; the controller firmware does not actually need PSRAM.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
  ; USB CDC so Serial works over the native USB port
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM

lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  ; WiFiManager is added in Faza 4 (network phase):
  ; https://github.com/tzapu/WiFiManager.git
